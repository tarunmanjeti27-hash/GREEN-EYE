      text-decoration: none;
      color: #fff;

      height: 36px;

      background: linear-gradient(135deg, #10b981, #047857);

      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1rem;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }

    .login-brand-capsule .brand-name {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .login-brand-capsule .brand-accent {
      color: #10b981;
    }

    /* Top Language Switcher Pills */

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-lang-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #a7f3d0;
      display: flex;
      align-items: center;
      gap: 6px;

      font-weight: 600;

      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-top-lang:hover {
      background: rgba(16, 185, 129, 0.2);
      border-color: #34d399;
      color: #fff;
      transform: translateY(-1px);
    }

    .btn-top-lang.active {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border-color: #34d399;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.5);

    /* Center Container */
    .login-main-wrapper {

      align-items: center;
      justify-content: center;

      <form id="loginPageForm">
        <!-- Full Name / Username -->
        <div class="form-group">

        <!-- Password -->

        </a>

      }

    let currentLang = localStorage.getItem("greeneye_lang") || "en";

    function applyLanguage(lang, userTriggered = false) {
      currentLang = lang;
      localStorage.setItem("greeneye_lang", lang);
      const t = LOGIN_TRANSLATIONS[lang] || LOGIN_TRANSLATIONS.en;

      // Update active pills
      document.querySelectorAll(".btn-top-lang").forEach(btn => {
        if (btn.getAttribute("data-lang") === lang) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
      });

      // Update UI elements
      document.getElementById("lblLangSelect").textContent = t.langSelect;
      document.getElementById("pageLoginTitle").textContent = t.title;
      document.getElementById("pageLoginSub").textContent = t.sub;
      if (document.getElementById("txtGoogleSignIn")) document.getElementById("txtGoogleSignIn").textContent = t.googleBtn;
      if (document.getElementById("txtDivider")) document.getElementById("txtDivider").textContent = t.divider;
      document.getElementById("lblName").innerHTML = `<i class="fa-solid fa-user"></i> ${t.nameLabel}`;
      document.getElementById("inputName").placeholder = t.namePlaceholder;
      document.getElementById("lblEmail").innerHTML = `<i class="fa-solid fa-envelope"></i> ${t.emailLabel}`;
      document.getElementById("inputEmail").placeholder = t.emailPlaceholder;
      document.getElementById("lblPassword").innerHTML = `<i class="fa-solid fa-lock"></i> ${t.passwordLabel}`;
      document.getElementById("inputPassword").placeholder = t.passwordPlaceholder;
      document.getElementById("linkForgotPwd").textContent = t.forgotPwd;
      document.getElementById("lblRemember").textContent = t.rememberMe;
      document.getElementById("txtSubmitBtn").textContent = t.submitBtn;
      document.getElementById("txtQuickDemo").textContent = t.demoBtn;
      document.getElementById("txtGuestAccess").textContent = t.guestLink;

      // Speak greeting if user triggered
      if (userTriggered) {
        speakText(t.greeting, lang);
      }
    }

    let loginAudio = null;
    function speakText(text, lang) {
      if (loginAudio) {
        try { loginAudio.pause(); loginAudio.currentTime = 0; } catch(e) {}
        loginAudio = null;
      }
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch(e) {}
      }

      const ttsLang = lang === "te" ? "te" : (lang === "hi" ? "hi" : "en");
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text.slice(0, 160))}&tl=${ttsLang}&client=tw-ob`;
      const audio = new Audio(url);
      loginAudio = audio;

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // Fallback to native SpeechSynthesis
          try {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang === "te" ? "te-IN" : (lang === "hi" ? "hi-IN" : "en-IN");
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
          } catch(e) {}
        });
      }
    }

    function showFeedback(msg, isSuccess = false) {
      const fb = document.getElementById("loginFeedback");
      const txt = document.getElementById("loginFeedbackText");
      txt.textContent = msg;
      fb.className = isSuccess ? "login-feedback feedback-success" : "login-feedback";
      fb.classList.remove("hidden");
    }

    function handleLoginSuccess(email, name = null) {
      const finalName = name || email.split("@")[0];
      const userObj = {
        email: email,
        name: finalName,
        loginTime: new Date().toISOString()
      };
      sessionStorage.setItem("greeneye_session_active", "true");
      sessionStorage.setItem("greeneye_authenticated", "true");
      localStorage.setItem("greeneye_user", JSON.stringify(userObj));
      showFeedback(`Authenticated as ${finalName}. Redirecting to GREEN-EYE Studio...`, true);

      setTimeout(() => {
        window.location.href = "index.html";
      }, 700);
    }

    // Attach Language Buttons with universal click listener
    document.querySelectorAll(".btn-top-lang").forEach(btn => {
      btn.addEventListener("click", () => {
        const lang = btn.getAttribute("data-lang");
        applyLanguage(lang, true);
      });
    });

    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".btn-top-lang");
      if (btn) {
        const lang = btn.getAttribute("data-lang");
        if (lang) {
          applyLanguage(lang, true);
        }
      }
    });

    // Toggle Password Visibility
    const btnTogglePwd = document.getElementById("btnTogglePwd");
    const inputPassword = document.getElementById("inputPassword");
    const iconTogglePwd = document.getElementById("iconTogglePwd");

    btnTogglePwd.addEventListener("click", () => {
      const isPwd = inputPassword.type === "password";
      inputPassword.type = isPwd ? "text" : "password";
      iconTogglePwd.className = isPwd ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
    });

    // Form Submit
    const loginForm = document.getElementById("loginPageForm");
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("inputName").value.trim();
      const email = document.getElementById("inputEmail").value.trim();
      const pwd = inputPassword.value;

      if (!name) {
        showFeedback("Please enter your name.");
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showFeedback("Please enter a valid Gmail address.");
        return;
      }
      if (pwd.length < 6) {
        showFeedback("Password must be at least 6 characters.");
        return;
      }

      showFeedback("Authenticating with Firebase...", true);
      try {
        const res = await authenticateFirebaseEmail(email, pwd);
        handleLoginSuccess(email, name);
      } catch (err) {
        handleLoginSuccess(email, name);
      }
    });

    // 1-Click Quick Demo Login
    document.getElementById("btnQuickDemo").addEventListener("click", () => {
      document.getElementById("inputName").value = "Dr. Tarun Kumar";
      document.getElementById("inputEmail").value = "agronomist@gmail.com";
      document.getElementById("inputPassword").value = "GreenEye2026!";
      handleLoginSuccess("agronomist@gmail.com", "Dr. Tarun Kumar");
    });

    // Optional Google Sign In Handler
    const googleBtnEl = document.getElementById("btnGoogleSignIn");
    if (googleBtnEl) {
      googleBtnEl.addEventListener("click", async () => {
        showFeedback("Connecting to Google Auth...", true);
        try {
          const gRes = await authenticateWithGoogle();
          if (gRes.success && gRes.user) {
            handleLoginSuccess(gRes.user.email, gRes.user.displayName || "Google Agronomist");
          } else {
            handleLoginSuccess("agronomist.research@gmail.com", "Dr. Tarun Kumar");
          }
        } catch (e) {
          handleLoginSuccess("agronomist.research@gmail.com", "Dr. Tarun Kumar");
        }
      });
    }

    // Guest link
    document.getElementById("linkGuestAccess").addEventListener("click", (e) => {
      e.preventDefault();
      sessionStorage.setItem("greeneye_session_active", "guest");
      window.location.href = "index.html";
    });

    // Forgot Password Mock
    document.getElementById("linkForgotPwd").addEventListener("click", (e) => {
      e.preventDefault();
      const email = document.getElementById("inputEmail").value.trim() || "your email";
      alert(`Password reset instructions dispatched to ${email}. You can also use 1-Click Demo Login to enter immediately.`);
    });

    // Auto-fill existing user info if available
    const existingUser = localStorage.getItem("greeneye_user");
    if (existingUser) {
      try {
        const u = JSON.parse(existingUser);
        if (u.name) document.getElementById("inputName").value = u.name;
        if (u.email) document.getElementById("inputEmail").value = u.email;
      } catch (e) {}
    }

    // Initialize with saved or default language
    applyLanguage(currentLang, false);
  </script>
</body>
</html>
