[project]
name = "green-eye"
version = "3.8.0"
description = "GREEN-EYE Precision Sugarcane Leaf Pathology Vision Suite & Agronomy Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
